name: CodeTutor checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Non-secret fixtures. No hosted service or deployment credential is
      # available to pull-request code. This build is never deployed.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@11.19.0
      - run: node scripts/check-toolchain.mjs
      - name: Verify curated lesson toolchains
        run: |
          javac -version
          java -version
          g++ --version
          python3 --version
      - name: Clean frozen install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm type-check
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: pnpm check:ci-smoke
      - name: Reject generated dependency/config drift
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json

  database:
    name: Database replay and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global --ignore-scripts pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local database and auth
        # Suppress the CLI's successful status summary (disposable keys).
        run: npx --yes supabase@2.116.0 start --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Replay every migration from an empty local database
        run: npx --yes supabase@2.116.0 db reset --local --no-seed --yes
      - name: Lint application SQL
        run: npx --yes supabase@2.116.0 db lint --local --schema public,private --level error --fail-on error
      - name: Database invariants and generated type comparison
        run: node scripts/ci-database.mjs
      - name: Destroy only this disposable CI database
        if: always()
        run: npx --yes supabase@2.116.0 stop --project-id vibe-coding-platform --no-backup

  required:
    name: Required checks
    needs: [application, database]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both jobs to pass
        env:
          APP_RESULT: ${{ needs.application.result }}
          DB_RESULT: ${{ needs.database.result }}
        run: test "$APP_RESULT" = success && test "$DB_RESULT" = success
